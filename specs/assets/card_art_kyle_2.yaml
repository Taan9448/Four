style: >-
  crisp pixel art in the style of late 16-bit era game item and skill illustrations; flat 2-3 tone shading, light from the upper left, a 1-pixel dark outline around the main subject only; cool fantasy world palette: moonlit silver, steel grey, deep blue and white, with warm red for the red sword and blood; no anti-aliasing, no gradients, no dithering noise, no blur
