frame_notes:
  1: "farmers with hoes standing shoulder to shoulder in a line"  # 대열 맞추기
  2: "a laughing knight with a raised finger and a small sweat drop"  # 농담 한마디
  3: "a chain of sword slash lines following one after another"  # 검의 길
  4: "a forearm with a long healed scar and a clenched fist"  # 흉터의 맹세
  5: "the Rowen crest: a blue field with a white snowflake and a silver sword"  # 로웬의 검
