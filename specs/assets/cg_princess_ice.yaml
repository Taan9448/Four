id: cg_princess_ice
type: story-cg
summary: 장면 일러스트 — 탑 꼭대기 — 얼음 옥좌 뒤의 리나 왕녀(S3, 2권 6장)
frame_notes:
  1: >-
    The top of the ice palace's highest tower: a wide round chamber with no ceiling, snow falling from an ash-grey sky. In the center stands a throne of ice, and behind it, sealed inside a column of clear ice, Princess Lina — golden hair braided up, a sky-blue dress — reaching forward with one hand as if trying to catch someone. Above the throne tens of thousands of snowflakes swirl and gather into a woman of ice twice a man's height, her hair hanging long like icicles, beautiful as a statue and as expressionless as one. Frost on every surface, cold pale light.
framing: >-
  A cinematic story illustration for a visual-novel scene. The bottom quarter of the picture will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Wide 3:2 frame, strong readable silhouettes, dramatic light, no text.
