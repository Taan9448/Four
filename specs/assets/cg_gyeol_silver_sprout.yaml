summary: '「결」 이야기 그림 — 돌 틈의 은빛 싹(에필로그) · 장면 사이를 잇는 원작 장면(2026-11-13 매끄러운 이야기)'
frame_notes:
  1: 'Late-winter morning in the back yard of Ungok Inn: in a crack between stones near the woodpile grows a small sprout with silver leaves that glow faintly, and the air around it shimmers like a tiny doorway. Elia (silver-haired half-elf mage woman in a grey hooded travelling cloak, long wooden staff with a blue stone) crouches beside it holding a teacup, smiling. Behind her Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) rests on the chopping block with an axe, and the giant boy Seokdu peeks over her shoulder. Patches of snow, soft light.'
