style: >-
  crisp pixel art in the style of late 16-bit era game item and skill illustrations; flat 2-3 tone shading, light from the upper left, a 1-pixel dark outline around the main subject only; cool fantasy world palette: moonlit silver, deep blue, frost white and forest green, with blue for mana, orange for fire and pale cyan for frost; no anti-aliasing, no gradients, no dithering noise, no blur
