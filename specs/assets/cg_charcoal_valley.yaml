id: cg_charcoal_valley
type: story-cg
summary: 장면 일러스트 — 숯막 골짜기의 새벽 — 안개가 걷히고 배진의 군사가 물길로 돈다(S6 엘리트, 개작 6권 14~15장)
frame_notes:
  1: >-
    Dawn in a narrow wooded valley where refugees shelter: an old charcoal-burners' hut with a half-collapsed roof, a dry-stone wall and a wooden palisade, cooking smoke, laundry lines. The morning mist is lifting too early. Behind the stone wall a line of farmers, woodcutters and a blacksmith hold home-made wooden shields, with a blond foreign knight in silver plate signalling them with his raised hand. On the ridge above, a calm commander in dark clothes and a black hood stands beside a pock-marked man, looking down; his soldiers in black hoods with curved sabres lay wooden planks along the stream bed to climb around the side. Cold blue dawn light, tension before the attack.
