frame_notes:
  1: >-
    keep exactly the same shapes and positions as the fusion card frame (reference: assets/sprites/card_frame_fusion/frame_01.png): the same
    art window, cost socket(s), name banner, rarity socket, text box and type plaque; only the materials and ornaments change.
    the WHOLE border is reforged in dark violet star-steel: deep violet-black metal plates (#2b2b3a, #4b3a6b, #6b4fa3) with bright violet lightning veins (#a35cff, #d4b8ff) crackling across them, a violet glow line around the art window, a small faceted violet crystal (#a35cff, #d4b8ff) at each corner; the outer edge is near-black (#0b0b10); the vertical seam down the middle of the card remains, so the card still reads as two halves (the left half with touches of dark lacquered wood #4a3426, the right half with touches of deep blue leather #1f3f73) joined by a bright metal seam
style: >-
  crisp detailed pixel art in the style of a late 16-bit era game interface; 1-pixel dark outline on the outer edge, 2-3 flat tone
  steps per material, bevelled metal reads clearly, no anti-aliasing, no gradients, no dithering noise, no blur
