allow_purple: true
frame_notes:
  1: >-
    THIS IS A TOP-TIER FORGED CARD and must look DRAMATICALLY MORE LAVISH than the base frame — never a simple recolor of it. Keep only the positions and sizes of the art window, cost socket(s), name banner, rarity socket, text box and type plaque from the reference (the game prints text there); everything else is redesigned: a thicker, layered border carved in raised relief with several depth steps, dense ornaments on every side and corner, extra gems, and ornaments that grow over the edges of the art window rim and the ends of the name banner (but never into the art window opening or the text box). Much more detail and contrast than the base frame.
    +9 VIOLET LIGHTNING: dark violet star-steel (#2b2b3a, #4b3a6b, #6b4fa3) carved in relief with forked lightning bolts that glow bright violet and white (#a35cff, #d4b8ff, #f1efe6); a jagged crown of lightning spikes rising from the middle of the top border; large clusters of faceted violet crystals at the four corners; crackling arcs leaping between the crystals along the sides; tiny white star specks scattered over the dark metal; the art window rim crackling with a thin violet lightning line; the name banner ending in jagged lightning-bolt tips; two crossed lightning bolts above the type plaque.
    Fusion touch (keep it subtle): a bright vertical seam still splits the card down the middle; the left half has hints of dark lacquered wood, the right half hints of deep blue leather.
style: >-
  crisp detailed pixel art in the style of a late 16-bit era game interface; 1-pixel dark outline on the outer edge, 2-3 flat tone
  steps per material, bevelled metal reads clearly, no anti-aliasing, no gradients, no dithering noise, no blur
