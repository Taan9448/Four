frame_notes:
  1: 'A narrow silver mine tunnel braced with old timber props, silver veins glittering in the rock. Born (short, very broad dwarf warrior with a red beard in three braids) leads in front, holding up a lantern, a taut rope tied around his waist running back to the others. Behind him Jin Haun at seventeen (lean servant boy, long straight black hair with long bangs, grey servant outfit, cloth-wrapped hands) with a woodcutting axe and Kyle (blond young knight in silver plate armor with a snowflake-and-sword crest) both grip the rope. At the very edge of the lantern light, on the tunnel ceiling ahead, the tips of long pale spider legs. Warm lantern light, deep black darkness beyond.'
