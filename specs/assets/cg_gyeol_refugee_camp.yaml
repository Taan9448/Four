summary: '「결」 이야기 그림 — 협곡 어귀의 피난민(3장) · 장면 사이를 잇는 원작 장면(2026-11-13 매끄러운 이야기)'
frame_notes:
  1: 'A hidden refugee camp in a rocky canyon mouth below a smoking volcanic range, ash drifting like snow. Mara, a stern woman in a patched brown coat with a ledger and a sack of flour, counts supplies at a crate. A ten-year-old boy Toma holds a pair of blacksmith tongs to his chest, looking up hopefully at Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) and Kyle (blond young knight in silver plate armor with a snowflake-and-sword crest). Makeshift tents, small fires, tired families. Red-orange glow from the canyon beyond.'
