summary: '「결」 이야기 그림 — 세 번 짧게, 한 번 길게(2장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'A clearing in a silver forest under two moons. Jin Haun, a seventeen-year-old servant boy in grey, crouches low alone, holding a fallen tree branch backhand over his shoulder like an axe about to split a log, eyes calm and focused. From the right a shadow wolf lunges at him — a calf-sized wolf of wavering black smoke with black flames along its spine and two red dots for eyes — and behind it trail three short faint afterimages and one long stretched afterimage, showing the rhythm of its attack. At the back of the wolf''s neck a single thin bright line glows: the knot he will strike.'
