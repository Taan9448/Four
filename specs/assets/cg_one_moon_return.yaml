summary: 장면 일러스트 — 하나뿐인 달 — 삼 년 만의 귀곡애(S5 끝·S6 시작)
frame_notes:
  1: >-
    Night on the Ghost Valley cliff (Gwigok-ae) in the wuxia world: a sheer cliff edge above a dark sea of clouds, a small hexagonal pavilion at the rim with its pillars wrapped in torn blood-red cloth bearing a red droplet emblem. A single moon — only one — hangs pale and lonely in the sky. Four travellers stand at the cliff edge seen from behind and slightly to the side, looking out over the mountains: Jin Haun in a grey servant outfit with a narrow plain sword in a plain black scabbard, Elia with her hood pulled down and her blue-stone staff, Kyle in silver plate armor looking up at the moon, and Born the short red-bearded dwarf touching the rock. The air is heavy with a faint dark-red haze drifting between the pines, and far below on the sect mountain a few red banners and torches burn. Melancholy, ominous, quiet. Haun carries the plain, narrow, completely unadorned 'ugly sword' with a crude plain grip, in a plain black scabbard; he does NOT carry an axe.
