  - elia_poultice  # 약초 찜질
  - elia_sprout  # 은빛 새싹
  - elia_frost_bloom  # 서리꽃
  - elia_silien_song  # 실리엔의 노래
frame_notes:
  1: "a wooden staff swung like a club with a swoosh"  # 지팡이 휘두르기
  2: "a white frosty breath blown from an open palm"  # 찬 숨결
  3: "a cloth wrap of green herbs tied around a forearm"  # 약초 찜질
  4: "a tiny silver sprout curling up from the ground"  # 은빛 새싹
  5: "a ring of white frost flowers blooming on the ground"  # 서리꽃
