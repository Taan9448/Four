id: cg_silver_tree_gate
type: story-cg
summary: 장면 일러스트 — 귀곡애의 은빛 나무 — 바늘구멍만 한 문(S9 끝, 4권 에필로그)
frame_notes:
  1: >-
    Night, halfway down the Ghost Valley Cliff, one year later: a silver tree with silver leaves has grown out of the rock face and wraps its branches around the ancient moss-covered stone gate with its flowing wave letters and the small cloud emblem on its frame. On one side of the sky hangs this world's single full moon; through a tiny pinhole-sized glowing gap in the gate, two full moons — one silver, one pale blue — can be glimpsed. A sea of clouds below, moonlight silvering the leaves; on a ledge at the foot of the tree, a small hut. Peaceful and healed.
