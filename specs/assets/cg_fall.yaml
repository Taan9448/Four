summary: 장면 일러스트 — 추락 — 구름바다로(S0 끝, 1권 6장)
frame_notes:
  1: >-
    Jin Haun falling backward from the Ghost Valley Cliff into a sea of moonlit clouds, seen from above and slightly to the side: his body turning in the air, a deep wound in his side with drops of blood scattering upward, his long black hair whipping, the moon spinning in the sky. High above at the cliff edge, a small white figure in a crane robe looks down. The towering dark cliff face fills one side of the frame, rushing past. He carries no axe (it was left behind); his hands are empty except where stated.
