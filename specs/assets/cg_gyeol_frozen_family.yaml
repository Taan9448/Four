summary: '「결」 이야기 그림 — 지붕 없는 방의 얼어붙은 왕가(4장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'Seen from the doorway at the top of a tower stair: a roofless round chamber, snow falling from an ash-grey sky. Frozen in clear ice in mid-gesture: a king half-drawing his sword, a queen reaching toward a small girl with golden braided hair in a sky-blue dress (Princess Lina). Above them floats Celias, a tall woman made of gathered snowflakes with a translucent ice body, icicle hair and a calm sculpted expressionless face, her hand resting on the girl''s head.'
