    the WHOLE border is reforged as an awakened golden relic: polished gold plates (#b8741a, #f2a93b, #ffe08a) with red lacquer inlays (#a02634, #5a1020), small flame-shaped gold flourishes (#ff8a5c, #ffe08a) licking up both sides, a radiant gold sunburst crest at the middle of the top border, a bright gold glow line around the art window, gold sunburst ornaments with a white-gold core (#f1efe6) at the corners; the outer edge is dark (#2a1d16); the vertical seam down the middle of the card remains, so the card still reads as two halves (the left half with touches of dark lacquered wood #4a3426, the right half with touches of deep blue leather #1f3f73) joined by a bright metal seam
style: >-
  crisp detailed pixel art in the style of a late 16-bit era game interface; 1-pixel dark outline on the outer edge, 2-3 flat tone
  steps per material, bevelled metal reads clearly, no anti-aliasing, no gradients, no dithering noise, no blur
