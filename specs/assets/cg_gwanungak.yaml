id: cg_gwanungak
type: story-cg
summary: 장면 일러스트 — 관운각 — 절벽 위 육각 정자의 밀담(S0, 1권 5장)
frame_notes:
  1: >-
    Night at the very end of the Ghost Valley Cliff: a small hexagonal pavilion (Gwanungak) with upturned eaves and six wooden pillars stands on a rock that juts out over a thousand-fathom drop; far below, a sea of clouds silvered by the moon. Warm lamplight glows inside the pavilion, and through its open sides two seated silhouettes face each other across a low tea table with a scroll spread on it — a white-haired Taoist in a flowing white crane robe, and a man in a deep black conical straw hat (satgat) pulled low and a dustless black robe. A narrow stone stairway climbs to the pavilion along the cliff edge; in the deep shadow behind a rock near the pavilion lies a small forgotten basket of charcoal. Cold moonlight against warm lamplight, an ominous calm.
