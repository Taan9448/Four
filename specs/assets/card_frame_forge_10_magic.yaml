window_shape: >-
  a pointed gothic arch: the top rises to a soft point and the sides run straight down to a flat bottom, like a cathedral window
banner: "a crimson ribbon (#a02634, #5a1020) edged with bright gold (#f2a93b, #ffe08a) and with gold-capped ends"
