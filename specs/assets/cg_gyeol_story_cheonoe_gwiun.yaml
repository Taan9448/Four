summary: 「결」 이야기 회상 일러스트(먹 그림) — 천외귀운 — 마왕을 꿰뚫은 푸른 강물(S5 끝) · 「천외귀환」 cg_cheonoe_gwiun의 「결」판(2026-11-12)
frame_notes:
  1: 'The obsidian throne room of the Demon King at the instant of Cheonoe-gwiun: Jin Haun in his grey servant outfit, seen from a low three-quarter angle, has driven his narrow sword straight through the chest of Vargas the Demon King — a towering gaunt figure three times a man''s height with seven twisted black horns like a crown, torn bat wings and a tattered black mantle over obsidian armor. From the wound, rivers of pale blue light pour OUTWARD in every direction like streams returning home, flowing out through the cracked windows and the shattered spire into the night. The Demon King''s body is thinning, turning to grey ash at the edges. Through the broken roof, above the black clouds tearing apart, two moons — a large white one and a smaller pale blue one — are rising together. Elia (silver hair tied back, grey hooded cloak, staff with a blue stone) kneels in the background beside a silver sapling that grew from the floor, blood at her nose; Kyle (blond knight in silver plate) and
    Born (stocky red-bearded dwarf with a two-handed axe) brace behind her. He carries the plain, narrow, completely unadorned ''ugly sword'' with a crude plain grip, in a plain black scabbard; he does NOT carry an axe.'
framing: 'A cinematic story illustration for a visual-novel scene, wide 3:2 frame. The bottom quarter will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Same moment and composition idea as the original scene, but painted as Jin Haun''s memory: strong readable silhouettes, the edges of the picture dissolve into blank paper. No text.'
style: 'Gyeol story recollection: an East Asian ink-wash (sumi-e) painting on warm aged rice paper — confident black ink brush lines, soft grey and muted indigo washes, a restrained palette of ink black, warm paper beige and muted indigo with exactly ONE vermilion red accent in the picture, visible brush texture and ink bleeding at the edges, the scene fading softly into blank paper at the outer borders like a remembered moment told at night; faces and hands still clear and expressive; a small plain square vermilion seal stamp with no characters in one lower corner; not anime cel shading, not pixel art, not a photograph'
