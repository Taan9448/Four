frame_notes:
  1: >-
    Born, a broad, short dwarf warrior with a huge braided red beard and red hair, thick arms, brown leather and grey wool clothes with iron studs, holding a heavy double-bladed battle axe, striking a cliff face with the butt of his axe, the cliff collapsing along its grain in great slabs of rock behind the enemy; calm knowing eyes, dust and brown-orange light.
framing: >-
  A wide, dynamic cinematic cut-in illustration for an action game special move. Born is large and in the left half of the
  picture, from the knees up; the effect fills the right half and the background. Strong diagonal composition, motion and light,
  readable at a glance. The left and right edges may be cropped by the game. No text, no letters.
