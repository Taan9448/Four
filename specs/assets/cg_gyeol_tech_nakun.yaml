frame_notes:
  1: >-
    Jin Haun, a lean, wiry young East Asian swordsman with long straight black hair falling past the shoulders and long bangs over sharp calm black eyes, pale skin, a worn plain grey servant's jacket tied with a cord sash, grey trousers, bandaged forearms, holding a narrow, completely plain straight sword with a crude grip, seen from the side in a fluid mid-motion pose, the plain sword sweeping softly downward as if guiding something to the ground; pale blue and white cloud ribbons spiral down from the sky around him and settle like falling feathers; his eyes are calm and half-closed; a pale moonlit sky, cool blue-white light.
