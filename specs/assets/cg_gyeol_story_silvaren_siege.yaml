id: cg_gyeol_story_silvaren_siege
type: story-cg
summary: 「결」 이야기 회상 일러스트(먹 그림) — 실바렌 — 금 간 초록 결계와 마왕군(S1, 1권 13장) · 「천외귀환」 cg_silvaren_siege의 「결」판(2026-11-12)
frame_notes:
  1: 'Midnight in the silver forest under a wall of black cloud that hangs just above the treetops: the elven village Silvaren — seven huge silver trees standing in a ring, houses hung among their branches and linked by vine bridges, tiny lights in the windows. A thin pale-green barrier dome wraps the seven trees, cracked like a spider web in many places and flickering like a dying lamp. Outside it, hundreds of shadow wolves (calf-sized, bodies of wavering black smoke, two red dots for eyes) and rows of hollow black armor, with only two red sparks glowing inside each empty helmet, thrust spears at the barrier in unison. In the middle of the army towers a knight and horse made of black smoke, twice a man''s height, raising a greatsword of smoke against the barrier. The surrounding silver trees have withered to ash grey and black smoke rises from the dead ground. Seen from a dark ridge, wide and ominous.'
framing: 'A cinematic story illustration for a visual-novel scene, wide 3:2 frame. The bottom quarter will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Same moment and composition idea as the original scene, but painted as Jin Haun''s memory: strong readable silhouettes, the edges of the picture dissolve into blank paper. No text.'
style: 'Gyeol story recollection: an East Asian ink-wash (sumi-e) painting on warm aged rice paper — confident black ink brush lines, soft grey and muted indigo washes, a restrained palette of ink black, warm paper beige and muted indigo with exactly ONE vermilion red accent in the picture, visible brush texture and ink bleeding at the edges, the scene fading softly into blank paper at the outer borders like a remembered moment told at night; faces and hands still clear and expressive; a small plain square vermilion seal stamp with no characters in one lower corner; not anime cel shading, not pixel art, not a photograph'
