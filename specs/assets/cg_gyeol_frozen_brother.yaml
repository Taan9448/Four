frame_notes:
  1: 'A frozen village square in Arden: a small boy (Ern) stands half-sealed in a block of clear ice up to his chest, eyes closed. His older sister Mera, about twelve, presses both hands on the ice, crying. Elia (silver-haired half-elf mage woman in a grey hooded travelling cloak, long wooden staff with a blue stone) kneels beside her and gently stops Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard)''s sword hand from moving, shaking her head. Snow falling, blue-grey light.'
