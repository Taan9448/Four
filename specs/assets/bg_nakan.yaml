id: bg_nakan
type: background
summary: 전투 배경 — 낙안봉(S7, 3권 11장)
frame_notes:
  1: >-
    Nakan peak of Mount Hua: on the left edge a sheer granite cliff with a hidden narrow passage, on the right edge the dark stone wall of the cult branch fortress with a torn dark-red banner. In the distance the other peaks of Mount Hua rise through mist under a dusk sky with a faint red haze. The ground is a rocky ledge with a few twisted pines. Granite grey, pine green and dark red accents.
