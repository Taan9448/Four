id: card_frame_fusion
type: card-frame
summary: >-
  the frame of a FUSION card that uses both inner qi and mana: the left half is the martial arts frame (lacquered wood, brass, hanji)
  and the right half is the magic frame (blue leather, silver), joined by a gold seam, crowned with gold
# 무공 틀과 같은 layout에 비용 자리만 둘(왼쪽 내공 · 오른쪽 마나)
layout:
