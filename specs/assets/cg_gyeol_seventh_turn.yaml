summary: '「결」 이야기 그림 — 일곱째 굽이에 남는 사람(9장) · 장면 사이를 잇는 원작 장면(2026-11-13 매끄러운 이야기)'
frame_notes:
  1: 'Night on a steep torch-lit stone stairway winding around a black mountain peak. On a landing at the seventh turn, Elia (silver-haired half-elf mage woman in a grey hooded travelling cloak, long wooden staff with a blue stone) plants her staff into the stone and a thin thread of blue light stretches from it down the stairs behind them. She smiles at Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard), who stands two steps above, looking back at her before continuing up alone toward a red glow at the summit.'
