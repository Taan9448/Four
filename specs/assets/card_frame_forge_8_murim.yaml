# 대강화 +8 무공 카드 틀 전체(2026-10-22 사용자 요청 — 테두리만 바뀌어 카드 디자인이 그대로였다. 2026-10-23: 첫 작업이 기본 틀 색만 바꾼 것이라 '고강인 만큼 화려하게' 다시). card_frame_murim와 자리(layout)가 같고
# 장식은 훨씬 화려하게, 재질은 +8(은청 강철)로 바뀐다. 그림이 오면 게임이 card_frame_murim 대신 이 틀을 쓴다(src/ui/card-view.ts). 오기 전에는 겹치는 테두리(card_frame_forge_8)
