frame_notes:
  1: 'Dusk in a village inn''s back yard in late winter: Jin Haun, now a young man in a simple grey work outfit, alone, raising his axe again over a log on the chopping block; a modest pile of unsplit wood remains. Behind him the inn''s windows glow warm, and inside them the soft silhouettes of a silver-haired woman, a very tall boy and an old man in a wheeled chair. First stars above the mountains.'
