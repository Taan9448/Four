id: cg_silvaren_siege
type: story-cg
summary: 장면 일러스트 — 실바렌 — 금 간 초록 결계와 마왕군(S1, 1권 13장)
frame_notes:
  1: >-
    Midnight in the silver forest under a wall of black cloud that hangs just above the treetops: the elven village Silvaren — seven huge silver trees standing in a ring, houses hung among their branches and linked by vine bridges, tiny lights in the windows. A thin pale-green barrier dome wraps the seven trees, cracked like a spider web in many places and flickering like a dying lamp. Outside it, hundreds of shadow wolves (calf-sized, bodies of wavering black smoke, two red dots for eyes) and rows of hollow black armor, with only two red sparks glowing inside each empty helmet, thrust spears at the barrier in unison. In the middle of the army towers a knight and horse made of black smoke, twice a man's height, raising a greatsword of smoke against the barrier. The surrounding silver trees have withered to ash grey and black smoke rises from the dead ground. Seen from a dark ridge, wide and ominous.
