frame_notes:
  1: >-
    keep exactly the same shapes and positions as the fusion card frame (reference: assets/sprites/card_frame_fusion/frame_01.png): the same
    art window, cost socket(s), name banner, rarity socket, text box and type plaque; only the materials and ornaments change.
    the WHOLE border is reforged in tempered blue-white steel: bevelled steel plates (#5d6478, #8a90a3, #c2c6d1, #f1efe6) held by small rivets, a thin glowing ice-blue line (#4fb4ff, #8fd3ff) running along the inner edge of the border and around the art window, steel clasps with a tiny blue spark at the four corners; the outer edge is dark navy (#1d2433); the vertical seam down the middle of the card remains, so the card still reads as two halves (the left half with touches of dark lacquered wood #4a3426, the right half with touches of deep blue leather #1f3f73) joined by a bright metal seam
style: >-
  crisp detailed pixel art in the style of a late 16-bit era game interface; 1-pixel dark outline on the outer edge, 2-3 flat tone
  steps per material, bevelled metal reads clearly, no anti-aliasing, no gradients, no dithering noise, no blur
