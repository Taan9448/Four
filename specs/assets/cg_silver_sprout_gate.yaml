id: cg_silver_sprout_gate
type: story-cg
summary: 장면 일러스트 — 일곱째 다리 아래 은빛 싹의 문 — 한 해 뒤, 두 세계가 오간다(S9 에필로그, 개작 10권 23장)
# 2026-10-31 개작 원고 B안: 문 자리가 귀곡애 → 천마봉 일곱째 다리 아래로 바뀜
frame_notes:
  1: >-
    Under the seventh stone bridge of the Nine-Heaven Stairs on Cheonma Peak, one year later, in early spring daylight: from a narrow crack in the rock beneath the old bridge grows a small slender SILVER sapling with silver leaves, its fine roots gripping the stone; between its roots and branches hangs a narrow upright opening of soft light just wide enough for one person to pass, framed by a low wooden fence that villagers have put around it. Through the opening another world is visible: a silver forest under two pale moons in a twilit sky, and a group waiting on the far side — a blond knight in silver plate, a stocky red-bearded dwarf holding up a new hammer, a tall dwarf blacksmith with soot on his arms and a grown boy beside him, an elder silver-haired elf woman. On this side, seen from behind, Jin Haun and Elia stand on the stone ledge. Calm, hopeful, healed; no black cracks in the sky.
