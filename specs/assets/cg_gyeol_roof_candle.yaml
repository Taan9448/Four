frame_notes:
  1: 'Night on the tiled roof of the Silver Bell inn in Hailon under two moons (one silver, one pale blue). Elia (silver-haired half-elf mage woman in a grey hooded travelling cloak, long wooden staff with a blue stone) sits cross-legged on the roof ridge with her palm open, holding a tiny calm flame of blue-white mana no bigger than a candle flame. Beside her Jin Haun, a young man with long black hair in a grey servant outfit, copies her with his own open palm, a tiny flame flickering too big and unsteady. Town lights below, quiet and warm.'
