summary: 장면 일러스트 — 돌내마을 대피 — 비 오는 나루와 그림자(S9 시작, 개작 9권 18~20장)
frame_notes:
  1: >-
    A rainy night at the river ferry of Dolnae village below Cheonma Peak: a swollen stream, a small wooden ferry boat tied to posts, villagers with bundles and children being helped aboard, an old man led out of a last house by a woman with a lantern. A water mill beside the river turns the wrong way. Out of the dark water rises a shadow creature that only half imitates a human shape, its long arm wrapping a ferry post and blackening the wood. Jin Haun in his grey outfit, narrow plain sword sheathed, does NOT cut it — he shoves a wooden plank between the shadow and the post. His face is tense and urgent — brows furrowed, jaw clenched, teeth gritted, straining with effort and fear for the villagers behind him; NOT calm or serene. High on the mountain behind, a thin black crack in the sky. Rain, lantern light, cold blue night.
