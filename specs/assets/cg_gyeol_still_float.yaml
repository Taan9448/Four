frame_notes:
  1: 'Inside the rift between worlds: a red-black void with no up or down, through which broken fragments of many worlds rush past like a river — a piece of tiled roof, a silver branch, a glass tower shard, a seashell. In the center Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) floats perfectly still, eyes closed, arms relaxed, sword sheathed; the whole river of fragments bends around him. He is the only thing not moving.'
