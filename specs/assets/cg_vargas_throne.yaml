frame_notes:
  1: >-
    The throne room of the demon castle Nocturna, black obsidian walls, a shattered tall window showing a burning battlefield and violet lightning coiling around the spires outside. The Demon King Vargas stands in the middle of the hall, not on his throne: three times a man's height, torn bat wings, seven twisted horns rising like a crown. Before him, on a round obsidian dais, stands a huge stone gate carved with wave-like letters, its whole frame bristling with hundreds of black iron wedges that warp the air around them like heat haze; its palm-shaped hollow is empty. In the foreground, small against the scale of the room, Jin Haun in his grey outfit with the narrow plain sword lowered faces the demon king, Elia with her staff and Kyle with his crimson-bladed sword behind him.
