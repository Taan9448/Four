summary: '「결」 이야기 그림 — 횃불로 가득 찬 숲(1장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'A dense pine forest on Cheongun Mountain at night. Jin Haun at seventeen (lean servant boy, long straight black hair with long bangs, grey servant outfit, cloth-wrapped hands) runs toward the viewer between the trunks, glancing back over his shoulder, breath steaming, a woodcutting axe in one hand. Behind him, deep among the trees, dozens of torches move in a long line, and between them glimpses of white-robed sect disciples with drawn swords. Orange torchlight from behind rims his silhouette; the forest ahead of him is dark blue.'
