summary: '「결」 이야기 그림 — 능선 위의 배진(7장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'On a pine ridge before dawn, the Black Wind captain crouches at the edge, looking down; two hooded men in black crouch behind him. Below, in a narrow valley, a refugee camp: a dry-stone wall, a wooden palisade, cooking smoke rising from cauldrons, morning mist. Seen from behind his shoulder so we look where he looks.'
