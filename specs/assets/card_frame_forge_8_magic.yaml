    the WHOLE border is reforged in tempered blue-white steel: bevelled steel plates (#5d6478, #8a90a3, #c2c6d1, #f1efe6) held by small rivets, a thin glowing ice-blue line (#4fb4ff, #8fd3ff) running along the inner edge of the border and around the art window, steel clasps with a tiny blue spark at the four corners; the outer edge is dark navy (#1d2433); a few touches of the magic frame remain: thin strips of deep blue leather (#1f3f73) between the metal plates and the ring of abstract magic-circle marks (dots and arcs, no letters) around the art window rim
style: >-
  crisp detailed pixel art in the style of a late 16-bit era game interface; 1-pixel dark outline on the outer edge, 2-3 flat tone
  steps per material, bevelled metal reads clearly, no anti-aliasing, no gradients, no dithering noise, no blur
