summary: 장면 일러스트 — 벽운단하 — 협곡을 세로로 가른 푸른 검광(S2, 2권 4장)
frame_notes:
  1: >-
    The volcanic canyon at the instant of the first Byeogun-danha: a vertical blade of deep midday-blue sword light splits the whole scene from top to bottom — through the crown of Ignis, a human-shaped figure of white fire three times a man's height with black lava running through it like veins and a crown of flames, down his chest, through the throne carved into the cliff face, to the hardened lava floor — and the fire giant is coming apart in two exact halves. The red mana that had been swirling toward Ignis turns blue where it meets the stroke. At the bottom of the frame Jin Haun in his grey servant outfit finishes the downward cut, his narrow sword blazing blue. Around the great furnace the chains on the enslaved smiths' ankles darken and shatter and the fires go out. He carries the plain, narrow, completely unadorned 'ugly sword' with a crude plain grip, in a plain black scabbard at his hip; he does NOT carry an axe.
