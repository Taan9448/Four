summary: '「결」 이야기 그림 — 이제 장작이나 패러 가자(10장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'Dawn in the inn''s back yard, frost on the ground, the sky turning pale gold behind the mountains. Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) pushes Wang Ilgeom (a very old man with a sickle-bent back, thin white hair tied back, worn grey-brown robe, no legs, sitting in a plain wooden chair with cart wheels, a blanket flat over his lap)''s wheeled chair toward the woodpile and the chopping block; the old man points ahead with his stick of firewood. Seen from behind them at a slight distance. Peaceful, a new day.'
