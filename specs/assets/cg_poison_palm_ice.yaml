frame_notes:
  1: >-
    Night on the Nine Heavens Stairs of Cheonma Peak: steep torch-lit stone steps winding up a dark mountain. On the steps above stands an old cult elder in black robes layered with a moss-green outer robe, a long white beard, his right hand stained blue-black up to the wrist; he thrusts that palm forward and a burst of dark green poison mist pours from it, the stone steps hissing and melting into bubbles where the mist touches. Between him and the party a tall wall of clear blue ice has just erupted from the steps; his poisoned palm strikes the ice and black-green rot spreads across the surface like ink in water, but the wall holds. Just behind the wall Elia stands with one hand raised and frost streaming from her fingers, her silver hair and grey hooded cloak blown back by the cold, her staff in the other hand. Dim figures of companions and torchbearers are behind her. Warm orange torchlight on the elder's side, cold blue ice light on Elia's side.
