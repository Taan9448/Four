summary: 「결」 이야기 회상 일러스트(먹 그림) — 독장과 얼음 벽 — 독장 장로 앞을 막아선 엘리아(S8, 축약본 8장) · 「천외귀환」 cg_poison_palm_ice의 「결」판(2026-11-12)
frame_notes:
  1: 'Night on the Nine Heavens Stairs of Cheonma Peak: steep torch-lit stone steps winding up a dark mountain. On the steps above stands an old cult elder in black robes layered with a moss-green outer robe, a long white beard, his right hand stained blue-black up to the wrist; he thrusts that palm forward and a burst of dark green poison mist pours from it, the stone steps hissing and melting into bubbles where the mist touches. Between him and the party a tall wall of clear blue ice has just erupted from the steps; his poisoned palm strikes the ice and black-green rot spreads across the surface like ink in water, but the wall holds. Just behind the wall Elia stands with one hand raised and frost streaming from her fingers, her silver hair and grey hooded cloak blown back by the cold, her staff in the other hand. Dim figures of companions and torchbearers are behind her. Warm orange torchlight on the elder''s side, cold blue ice light on Elia''s side.'
framing: 'A cinematic story illustration for a visual-novel scene, wide 3:2 frame. The bottom quarter will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Same moment and composition idea as the original scene, but painted as Jin Haun''s memory: strong readable silhouettes, the edges of the picture dissolve into blank paper. No text.'
style: 'Gyeol story recollection: an East Asian ink-wash (sumi-e) painting on warm aged rice paper — confident black ink brush lines, soft grey and muted indigo washes, a restrained palette of ink black, warm paper beige and muted indigo with exactly ONE vermilion red accent in the picture, visible brush texture and ink bleeding at the edges, the scene fading softly into blank paper at the outer borders like a remembered moment told at night; faces and hands still clear and expressive; a small plain square vermilion seal stamp with no characters in one lower corner; not anime cel shading, not pixel art, not a photograph'
