frame_notes:
  1: 'A volcanic canyon under an ash-red sky: terraces of forges cut into black rock, rows of chained people swinging hammers onto glowing anvils, sparks and ash falling like snow. In the nearest row, among the prisoners, Born (short, very broad dwarf warrior with a red beard in three braids) wears chains on his wrists by his own choice and swings a borrowed hammer; he glances sideways out of the picture toward someone hiding on the ridge and gives a tiny nod. Heat haze, orange light from below.'
