id: cg_nakan_crack
type: story-cg
summary: 장면 일러스트 — 낙안봉 — 아물지 않는 금(S7, 3권 11장)
frame_notes:
  1: >-
    Nightfall after the battle of Nakan Peak, the highest of Mount Hwa's five peaks: on its summit the cult's branch fortress lies broken open where a beam of blue light tore through its walls. From the top of the peak a black crack runs straight up across the starry sky to the very edge of the heavens and does not heal; beyond it, a colorless darkness. Below, the flooded valley where thousands have laid down their weapons. Among the ruins a silver-haired woman in a grey hooded cloak holds a group of bandaged children close, looking up at the crack. Stars, cold blue night.
