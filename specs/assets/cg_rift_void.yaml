id: cg_rift_void
type: story-cg
summary: 장면 일러스트 — 세계의 틈 — 떠다니는 세계의 조각들(S9, 4권 3장)
frame_notes:
  1: >-
    Inside the rift between worlds: a boundless red-black darkness with no up or down. Broken fragments of many worlds float in it at different distances — half of a tiled roof of an East Asian hall, a branch with silver leaves, the tip of an obsidian spire, a tower as clear as glass, a huge spiral seashell, a forest hanging upside down, a bowl of sand glowing like stars. In the foreground floats a slab of red stone from a temple floor, with four tiny far-off silhouettes standing on it. Faint threads of light are being drawn away from everything into the dark. Eerie, silent and hungry.
framing: >-
  A cinematic establishing story illustration of a place for a visual-novel scene. The bottom quarter of the picture will be covered by a dialogue box, so keep the key landmarks and any figures in the upper three quarters. Wide 3:2 frame, strong readable silhouettes, dramatic light, no text.
