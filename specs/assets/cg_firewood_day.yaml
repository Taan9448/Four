summary: 장면 일러스트 — 장작 패는 날 — 운곡촌 마당의 늦겨울(S9 에필로그, 개작 10권 24장)
# 2026-10-31 개작 원고 B안: 결말이 '청운직상'에서 '장작 패는 날'로 바뀜
frame_notes:
  1: >-
    A quiet late-winter morning in the yard of a small village house in Ungok village: packed earth with patches of old snow, a low stone wall, a wooden veranda (maru) under a tiled roof, a stack of split firewood against the wall, thin smoke from a kitchen chimney, bare trees and soft mountains behind. In the center Jin Haun, now twenty-three, in a simple grey work outfit, stands at a chopping block holding a SMALL hand axe with a worn leather loop around his wrist; his posture is careful and unhurried, the first log beside the block split crookedly. Beside him Seokdu, a big broad-shouldered young man of about nineteen with a kind round face and short hair, crouches stacking the split pieces. On the veranda Elia, a silver-haired half-elf woman in a plain village jacket instead of her travelling cloak, comes out holding two steaming cups of tea. Warm low sunlight from the eaves, gentle and peaceful — no magic, no glowing effects, no sword.
