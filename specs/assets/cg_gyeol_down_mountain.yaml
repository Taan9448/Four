  1: 'A pine-lined mountain path at dusk. Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) walks down the path, his sword sheathed at his hip; a step behind him follows Jo Myeonggak — a pale young man in a white disciple robe with a red tassel, dark shadows under his upturned eyes, wrists loosely bound with cloth, head lowered. Below them, between the pines, the low tiled roofs of a village and thin cooking smoke.'
