frame_notes:
  1: >-
    The inside of an old martial-arts smithy at night, seen from the front: a large black iron anvil on a tree-stump block in the lower
    center, a roaring stone forge furnace in the back wall glowing orange-red with sparks rising, hammers, tongs and unfinished
    sword blades hanging on a dark wooden rack on the left, a water quench barrel and a stack of charcoal on the right. Wooden beams
    and a tiled roof edge above, faint smoke near the ceiling. Warm orange firelight against deep brown and charcoal shadows;
    the middle area around the anvil stays fairly plain and dark so game panels can sit on top.
