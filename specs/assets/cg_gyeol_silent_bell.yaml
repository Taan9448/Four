id: cg_gyeol_silent_bell
type: story-cg
summary: '「결」 이야기 그림 — 소리 없는 종(10장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'Evening on a grassy village hill: a village woman strikes a bronze bell hung on a wooden frame with all her strength, but the air around the bell is strangely still — no ripples, the grass not moving, as if the sound is swallowed. Below the hill, a black crack has opened in the slope and a long dark shape of smoke and broken shards crosses the meadow toward a small village with a water mill.'
