# 2026-10-31 개작 원고 B안: 초록빛 마법 다리(cg_green_bridge) 대신 줄사다리 다리
frame_notes:
  1: >-
    Night on the Nine-Heaven Stairs of Cheonma Peak: between the seventh and eighth turns the stone stairway has collapsed over a black abyss. A rope-ladder bridge has been stretched sideways across the gap, wooden planks lashed on, anchored with iron hooks to the far rock. On a rock of the seventh turn Elia, a silver-haired half-elf in a grey hooded cloak, kneels with one hand on the weakest knot of the ropes and her blue-stone staff glowing only faintly, a pinch of dust floating above her other palm — she is staying behind to watch the connection. A blond knight in silver plate and a scarred swordswoman cross first; behind them Jin Haun in his grey outfit with a narrow plain sword looks back over his shoulder at Elia. Arrows streak from the far cliff, torchlight, a faint red glow from the hall above. No glowing magic bridge.
