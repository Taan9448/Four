frame_notes:
  1: >-
    The obsidian throne room of the Demon King at the instant of Cheonoe-gwiun: Jin Haun in his grey servant outfit, seen from a low three-quarter angle, has driven his narrow sword straight through the chest of Vargas the Demon King — a towering gaunt figure three times a man's height with seven twisted black horns like a crown, torn bat wings and a tattered black mantle over obsidian armor. From the wound, rivers of pale blue light pour OUTWARD in every direction like streams returning home, flowing out through the cracked windows and the shattered spire into the night. The Demon King's body is thinning, turning to grey ash at the edges. Through the broken roof, above the black clouds tearing apart, two moons — a large white one and a smaller pale blue one — are rising together. Elia (silver hair tied back, grey hooded cloak, staff with a blue stone) kneels in the background beside a silver sapling that grew from the floor, blood at her nose; Kyle (blond knight in silver plate) and Born (stocky red-bearded dwarf with a two-handed axe) brace behind her. He carries the plain, narrow, completely unadorned 'ugly sword' with a crude plain grip, in a plain black scabbard; he does NOT carry an axe.
