frame_notes:
  1: >-
    Elia, a slender half-elf mage girl with long silver-white hair, pointed ears, calm grey eyes, a grey hooded travelling cloak over
    a brown leather dress with belts, holding a gnarled wooden staff topped with a glowing blue crystal, raising her staff, the blue
    crystal blazing, dozens of thin glowing blue mana arrows forming in the air above her and raining down diagonally, her silver hair
    and cloak blown by the magic.
