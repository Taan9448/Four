id: title_gyeol
type: key-art
summary: "「결」 시작 화면 — 쪼갠 장작의 결과 땅에 꽂힌 칼이 있는 먹빛 골짜기의 새벽(인물 없음, 2026-11-09)"
frame_notes:
  1: >-
    A misty East Asian ink-wash mountain valley at dawn, painted like a hanging scroll come to life: layered pale blue-grey peaks fading
    into fog, a few twisted pines on the cliffs, a thin waterfall far away, a faint gold sunrise behind the peaks. In the lower foreground,
    on packed earth, an old wooden chopping block with a log split cleanly in two so its pale wood grain shows bright, a wood axe leaning
    against the block, and a plain worn sword stuck upright in the ground beside it. A few autumn leaves drifting. Calm, quiet, before a duel.
framing: >-
  The center of the picture (the middle third of the width and the upper two thirds of the height) is calm misty sky and far peaks with
  no strong detail, because the big title character and the foe cards sit there; the chopping block and sword are small, in the lower
  left third. No people, no animals.
