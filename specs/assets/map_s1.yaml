id: map_s1
type: map-art
summary: 지역 지도 — 엘하임 숲 → 화산 협곡(S1)
frame_notes:
  1: >-
    A foreign fantasy land drawn by a wuxia traveler. Far left: a silver-leafed forest with tall slender trees and a small stone circle where the travelers arrive. Along the top and bottom edges: a border village with pointed roofs, a wolf den in rocks, a winding river. Far right: a volcanic canyon with jagged cliffs, a little vermilion wash for lava and smoke, and a small burning village.
framing: >-
  A wide horizontal regional map painted from above at a slight bird-eye angle, read from left to right like a handscroll: the left edge is where the journey starts and the right edge is the final destination. Draw terrain and landmarks only, small and light. Keep a wide open, pale band across the middle (from about 15% to 85% of the height) with only faint terrain texture, because the game draws the route, node markers and a small character there; put denser landmarks along the top and bottom edges and at the far left and far right. No roads or paths drawn as lines.
style: >-
  traditional East Asian ink-wash map painted with a brush on aged hanji paper: warm beige paper with soft fibers and slight stains, black and grey ink washes, a few muted color tints (moss green, ochre, faded blue, a little vermilion), hand-drawn brush lines with varying weight, light and airy, no hard digital gradients
