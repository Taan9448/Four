# 2026-10-12 D2: 그림 없던 절정 장면(s0_scene_cliff)
frame_notes:
  1: >-
    Dusk at the eastern edge of Gwigokae cliff: the forest ends abruptly at a sheer drop where a landslide has swept away the old animal path; wind howls up the cliff face and a sea of cloud churns far below. Jin Haun, a lean seventeen-year-old servant in his grey outfit with cloth-wrapped hands and a woodcutting axe, stands with his back to the edge, facing the trees. At the forest's border stands the sect leader Kwak Dojin, a tall, dignified middle-aged swordsman in an immaculate white crane-feather robe (hakchangui) without a single leaf on it, a long sword at his hip, perfectly calm, his eyes cold. The space between them is empty and tense; fallen leaves swirl in the wind.
