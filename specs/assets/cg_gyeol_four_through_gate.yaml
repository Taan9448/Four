frame_notes:
  1: 'The ancient moss-covered stone gate in the silver forest of the other world, now glowing open with soft light that shows a misty Eastern pine mountain on the other side. Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) (now twenty-three) stands at the threshold looking back over his shoulder, and behind him come Kyle (blond young knight in silver plate armor with a snowflake-and-sword crest), Elia (silver-haired half-elf mage woman in a grey hooded travelling cloak, long wooden staff with a blue stone) and Born (short, very broad dwarf warrior with a red beard in three braids, a two-handed axe) with travel packs, all stepping forward together. Two moons above the silver trees. Hopeful, warm.'
