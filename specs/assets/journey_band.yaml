id: journey_band
type: key-art
summary: 지도 여정 띠 — 두 세계를 잇는 원작의 여정(10스테이지 자리, 틈 없음, 가로로 잘라 씀)
frame_notes:
  1: >-
    A wide panoramic travel landscape, painted like an illustrated world map seen at a low angle, connecting two worlds. Left half
    is the wuxia martial world (warm ink-wash greys, pine green, misty blue), places from left to right at these horizontal
    positions: about 10% a mountain sect with grey-tiled roofs on Cheongun Mountain; about 18% (low) a small village by a willow and
    a forked valley; about 22% (high) one very tall sharp crimson-tinted peak with a stairway winding around it (the Heavenly Demon
    Peak); about 31% the five granite peaks of Mount Hua with a dark fortress on the highest. At 50%, a narrow stone gate in a sheer
    cliff wall (the Ghost Valley gate) is the only passage between the worlds. Right half is the fantasy world Elheim (silver, blue,
    green), from left to right: about 60% a silver forest under two small moons with elven houses in giant trees; about 70% (low) a
    volcanic canyon with a faint orange glow; about 78% (high) a frozen kingdom with an ice palace tower; about 87% grey mountains
    with a dwarf stone door; about 93% (high) a dark obsidian castle with black spires on a frozen sea. The sky above the center gate
    is open, plain and empty.
framing: >-
  The game crops this picture to a wide strip: only the middle part from 37% to 63% of the image height is shown, the top and bottom
  are cut off. Put every place listed above inside that middle strip at the given horizontal positions; keep the top and bottom thirds
  as simple sky and ground. Do not draw any crack or tear in the sky (the game draws it later as an event). The left half and the right half must each read as a complete scene on its own, because the game first shows only the left half and covers the right half with mist until the story reaches it. Do not write any place names.
