frame_notes:
  1: >-
    The mountain gate of the Cheongun sect at dusk, seen from below on the stone steps: the grey-tiled gate roof, and where a golden plaque once hung there is now a plaque painted blood-red with four heavy black brush characters (render them as bold, illegible black brush strokes, not readable text). Long blood-red banners with a single red droplet emblem hang from the gate pillars and flap in the wind; a golden curtain hangs between two flagpoles on the training yard beyond. On the steps in the foreground, small against the gate, Jin Haun in a grey servant outfit stands still, seen from behind, a narrow plain sword in a plain black scabbard at his hip, his long black hair moving in the wind. Heavy, sickly dark-red haze in the air, crows on the roof. Oppressive, a homecoming turned wrong. Haun carries the plain, narrow, completely unadorned 'ugly sword' with a crude plain grip, in a plain black scabbard; he does NOT carry an axe.
