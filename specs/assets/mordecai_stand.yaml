id: mordecai_stand
type: character-standing
character: mordecai
summary: 지옥왕 모르데카이 반신 그림(기본·결의·놀람) — 거인 클로즈업으로 다시 그림(2026-10-22, 칸에 몸 전체를 구겨 넣지 않고, 머리·어깨·가슴의 심장만 크게 잘라 보여 준다)
bleed: true
framing: >-
  Mordecai is a towering GIANT stitched together from the bodies of many worlds. Frame him as a CLOSE-UP of the head, shoulders and chest only: the black horns
  and the great spine of iron wedges rise behind the head and may be cut by the top edge; the white mask head is LARGE, about 35% of the cell width, with the
  eyes at about one quarter of the cell height; the broad stitched shoulders and the tops of both arms (silver mana on one side, dark qi rings on the other)
  spread wider than the cell and are cut off by both panel sides; the blue-black heart sits in the chest in the lower half and the body is cut off by the
  bottom edge just below the heart. The low camera looks up at him so he looms over the viewer. Do NOT show the whole silhouette and do NOT squeeze the body to
  fit the narrow cell: it is a close-up of something far too big for the frame, and the parts that do not fit are simply cut off by the panel sides and the
  bottom edge.
frame_notes:
  1: "neutral expression — a large white mask head under black horns and the wedge spine, a calm hungry tilt, the stitched shoulders running off both sides"
  2: "resolute expression — the blue-black heart in the chest pulsing brighter, a silver claw and a red claw rising into the frame from below on both sides"
  3: "surprised expression — the stitches beneath the heart loosening, threads of light unraveling from the chest"
