summary: '「결」 이야기 그림 — 닫힌 석문과 두 달(2장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'A silver forest of another world at night: smooth silver-grey trunks, silver leaves glittering. In the middle stands a lone ancient stone gate covered with moss, with a hand-shaped groove carved in it. Jin Haun at seventeen (lean servant boy, long straight black hair with long bangs, grey servant outfit, cloth-wrapped hands), battered, a torn cloth tied around a wound in his side, kneels and presses his bloody palm into the groove; the gate stays shut and dark. Medium shot from the side, his tired face in profile. Through a gap in the canopy above, TWO moons — one silver, one pale blue.'
