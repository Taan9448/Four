summary: "「결」 기술 컷인 일러스트 — 운해귀종(雲海歸宗). 기술을 쓸 때 화면을 덮는다(2026-11-09)"
frame_notes:
  1: >-
    Jin Haun, a lean, wiry young East Asian swordsman with long straight black hair falling past the shoulders and long bangs over sharp calm black eyes, pale skin, a worn plain grey servant's jacket tied with a cord sash, grey trousers, bandaged forearms, holding a narrow, completely plain straight sword with a crude grip, standing calmly in the center of a vast swirling sea of golden-white clouds, the plain sword held level in front of him, eyes open and focused; great golden streams of light flow in a spiral around him and rush back outward toward the distance, blooming into a gigantic lotus of golden light petals behind him; warm golden and white light, awe-inspiring scale.
