summary: 「결」 이야기 회상 일러스트(먹 그림) — 큰 화로 — 사슬 박힌 바위째 화로를 치는 보른(S2, 2권 2~4장) · 「천외귀환」 cg_great_furnace의 「결」판(2026-11-12)
frame_notes:
  1: 'The innermost forge of the volcanic canyon: a colossal furnace of stacked black stone bound with iron bands, as tall as a tower, its open mouth roaring with WHITE flame that shoots up into an ash-red sky. Dozens of heavy iron chains run into the furnace body from every side, glowing red where they enter, and each chain ends at the ankle of an enslaved smith hunched at an anvil around it. In the foreground Born, the very stocky dwarf, with a broken shackle and a length of chain still on his own ankle and his red beard braided in three braids, has ripped a boulder out of the ground with a chain still embedded in it and swings it two-handed into the flank of the furnace; white sparks and cracks of light burst from the impact and the white flame lurches sideways. He does NOT hold his axe or any weapon besides the chained boulder. High above, on a throne carved into the cliff face behind the furnace, the silhouette of Ignis — a human-shaped figure of white fire three times a man''s height
    with black lava running through it like veins and a crown of flames — looks down. A few other dwarf slaves lift their hammers, turning toward the furnace.'
framing: 'A cinematic story illustration for a visual-novel scene, wide 3:2 frame. The bottom quarter will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Same moment and composition idea as the original scene, but painted as Jin Haun''s memory: strong readable silhouettes, the edges of the picture dissolve into blank paper. No text.'
style: 'Gyeol story recollection: an East Asian ink-wash (sumi-e) painting on warm aged rice paper — confident black ink brush lines, soft grey and muted indigo washes, a restrained palette of ink black, warm paper beige and muted indigo with exactly ONE vermilion red accent in the picture, visible brush texture and ink bleeding at the edges, the scene fading softly into blank paper at the outer borders like a remembered moment told at night; faces and hands still clear and expressive; a small plain square vermilion seal stamp with no characters in one lower corner; not anime cel shading, not pixel art, not a photograph'
