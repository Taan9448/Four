summary: 장면 일러스트 — 고대 석판 — 카즈둠 서고의 물결 문자(S5, 2권 10장)
frame_notes:
  1: >-
    Close-up in the dwarven library of Khazdum, a stone hall lined with carved stone shelves: on a heavy stone desk lies an ancient stone tablet, grey and chipped at the edges, densely carved with flowing wave-like letters — the same script as on the stone gates. A slender hand traces the letters one by one with a fingertip; the edge of a grey cloak sleeve; a candle, and the soft glow of the blue stone at the tip of a long wooden staff leaning against the desk. Winter quiet, warm candlelight against cold stone.
