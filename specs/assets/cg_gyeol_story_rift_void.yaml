id: cg_gyeol_story_rift_void
type: story-cg
summary: 「결」 이야기 회상 일러스트(먹 그림) — 세계의 틈 — 떠다니는 세계의 조각들(S9, 4권 3장) · 「천외귀환」 cg_rift_void의 「결」판(2026-11-12)
frame_notes:
  1: 'Inside the rift between worlds: a boundless red-black darkness with no up or down. Broken fragments of many worlds float in it at different distances — half of a tiled roof of an East Asian hall, a branch with silver leaves, the tip of an obsidian spire, a tower as clear as glass, a huge spiral seashell, a forest hanging upside down, a bowl of sand glowing like stars. In the foreground floats a slab of red stone from a temple floor, with four tiny far-off silhouettes standing on it. Faint threads of light are being drawn away from everything into the dark. Eerie, silent and hungry.'
framing: 'A cinematic story illustration for a visual-novel scene, wide 3:2 frame. The bottom quarter will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Same moment and composition idea as the original scene, but painted as Jin Haun''s memory: strong readable silhouettes, the edges of the picture dissolve into blank paper. No text.'
style: 'Gyeol story recollection: an East Asian ink-wash (sumi-e) painting on warm aged rice paper — confident black ink brush lines, soft grey and muted indigo washes, a restrained palette of ink black, warm paper beige and muted indigo with exactly ONE vermilion red accent in the picture, visible brush texture and ink bleeding at the edges, the scene fading softly into blank paper at the outer borders like a remembered moment told at night; faces and hands still clear and expressive; a small plain square vermilion seal stamp with no characters in one lower corner; not anime cel shading, not pixel art, not a photograph'
