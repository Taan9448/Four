frame_notes:
  1: >-
    keep exactly the same shapes and positions as the murim card frame (reference: assets/sprites/card_frame_murim/frame_01.png): the same
    art window, cost socket(s), name banner, rarity socket, text box and type plaque; only the materials and ornaments change.
    the WHOLE border is reforged in dark violet star-steel: deep violet-black metal plates (#2b2b3a, #4b3a6b, #6b4fa3) with bright violet lightning veins (#a35cff, #d4b8ff) crackling across them, a violet glow line around the art window, a small faceted violet crystal (#a35cff, #d4b8ff) at each corner; the outer edge is near-black (#0b0b10); a few touches of the martial arts frame remain: thin strips of dark lacquered wood (#2a1d16, #4a3426) between the metal plates and small cloud-scroll (xiangyun) shapes in the corner ornaments
style: >-
