summary: 「결」 이야기 회상 일러스트(먹 그림) — 장작 패는 날 — 운곡촌 마당의 늦겨울(S9 에필로그, 개작 10권 24장) · 「천외귀환」 cg_firewood_day의 「결」판(2026-11-12)
frame_notes:
  1: 'A quiet late-winter morning in the yard of a small village house in Ungok village: packed earth with patches of old snow, a low stone wall, a wooden veranda (maru) under a tiled roof, a stack of split firewood against the wall, thin smoke from a kitchen chimney, bare trees and soft mountains behind. In the center Jin Haun, now twenty-three, in a simple grey work outfit, stands at a chopping block holding a SMALL hand axe with a worn leather loop around his wrist; his posture is careful and unhurried, the first log beside the block split crookedly. Beside him Seokdu, a big broad-shouldered young man of about nineteen with a kind round face and short hair, crouches stacking the split pieces. On the veranda Elia, a silver-haired half-elf woman in a plain village jacket instead of her travelling cloak, comes out holding two steaming cups of tea. Warm low sunlight from the eaves, gentle and peaceful — no magic, no glowing effects, no sword. IMPORTANT: Haun''s feet stand firmly ON TOP of
    the packed-earth ground, both boots fully visible, not sunk into the dirt. Seokdu is broad-shouldered but soft and gentle-looking, slightly chubby, a boyish round friendly face — NOT muscular, NOT rugged or brawny. Elia has natural adult proportions (realistic head-to-body ratio, normal-length legs) and is drawn at the correct scale for where she stands on the veranda.'
framing: 'A cinematic story illustration for a visual-novel scene, wide 3:2 frame. The bottom quarter will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Same moment and composition idea as the original scene, but painted as Jin Haun''s memory: strong readable silhouettes, the edges of the picture dissolve into blank paper. No text.'
style: 'Gyeol story recollection: an East Asian ink-wash (sumi-e) painting on warm aged rice paper — confident black ink brush lines, soft grey and muted indigo washes, a restrained palette of ink black, warm paper beige and muted indigo with exactly ONE vermilion red accent in the picture, visible brush texture and ink bleeding at the edges, the scene fading softly into blank paper at the outer borders like a remembered moment told at night; faces and hands still clear and expressive; a small plain square vermilion seal stamp with no characters in one lower corner; not anime cel shading, not pixel art, not a photograph'
