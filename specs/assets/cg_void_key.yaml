frame_notes:
  1: >-
    Close-up on the melted obsidian floor of the Demon King's throne room: where his ash has blown away lies a black crystal the size of a fist, smooth and many-faceted, and inside it something circles slowly like starlight — tiny points of light turning in a dark whirl. Grey ash drifts around it. Behind, out of focus, the round obsidian dais and the giant sleeping stone gate studded with hundreds of black wedges. A faint cold glow from the crystal on the black floor.
