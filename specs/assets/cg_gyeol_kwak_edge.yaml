frame_notes:
  1: 'The crumbled edge of a sheer cliff under a full moon, seen from slightly behind and to the side: Kwak Dojin stands alone at the broken rim, wind lifting his white sleeves, calmly sliding his pine-grain sword back into its sheath while looking down. Far below, a churning sea of moonlit cloud has already swallowed everything; only a few falling rock fragments and a torn strip of grey cloth drift down into it. No one else is visible. Cold, quiet, lonely.'
