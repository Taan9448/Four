# 에셋 명세 템플릿. 복사해서 <id>.yaml로 저장한다. 이 파일은 Claude만 쓴다(Codex는 수정 금지).
# 프레임 번호는 모든 파일에서 1부터 센다.
id: example_attack            # 파일 이름과 같아야 한다
type: character-anim          # character-anim | character-ref | fx | card-art | background | portrait
size: small                   # small = 32×32 스프라이트(기본) | large = 64×64(보스·큰 이펙트)
character: example            # docs/ART_STYLE.md의 subjects 키
summary: 한 줄 요약(이슈 제목에 쓰임)
depends_on: [example_ref]     # 이 에셋보다 먼저 머지돼야 하는 에셋
reference: assets/source/example_ref.png   # 생성 때 첨부할 기준 시트
# canvas / grid / cell / logical은 생략하면 type·size 기본값(docs/ASSET_PIPELINE.md 2절)
# palette: master             # master(ART_STYLE.md 마스터 팔레트로 색 맞춤, 기본) | free
# max_colors: 16              # 스프라이트 하나의 권장 최대 색 수
chroma: magenta               # magenta | green | black | none (생략하면 type 기본값)
frames: 6                     # 생략하면 애니메이션 기본값(idle 4, attack 6, skill 8, hit 3, death 6)
fps: 12
loop: false
facing: right                 # 아군 right, 적 left
baseline: 0.9
events: { hit: 4 }
# bbox_tolerance: 0.20        # 생략하면 애니메이션 기본값(idle 8%, attack 20%, skill 25%, hit 15%, death 검사 안 함)
frame_notes:
  1: wind-up pose
  2: ...
placeholder:                  # 임시 시트용(make-placeholder) 모양·색
  shape: humanoid             # humanoid | beast
  color: '#5577aa'
  accent: '#3fa9f5'
