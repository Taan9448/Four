# 2026-11-16 다시 그림(사용자 보고 "팔이 돌아가 있거나 검이 휘어 있다"): 도끼 자루가 머리 위 손에서 바위까지 비정상적으로 길게 이어지고 몸 뒤로 휘어 보였다
frame_notes:
  1: >-
    Born, a broad, short dwarf warrior with a huge braided red beard and red hair, thick arms, brown leather and grey wool clothes
    with iron studs, holding a heavy double-bladed battle axe, bringing his huge axe down overhead in a mighty blow that splits a
    boulder in two, an orange arc of force following the axe, chips of rock flying, braided beard swinging.
    Pose (redrawn 2026-11-16): the axe is a short, straight dwarf battle axe — the handle only as long as his arm — gripped in BOTH hands near its end; we see the moment of impact: his arms are extended forward and down, and the axe head is in front of him, just past his hands, buried in the boulder. The handle never passes behind his body.
