summary: '「결」 이야기 그림 — 장작 패는 녀석을 보는 왕일검(6장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'Present day, night, the inn''s back yard lit by one lantern. Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) splits a log on the chopping block, the axe at the top of its swing, split pieces flying. In the foreground Wang Ilgeom (a very old man with a sickle-bent back, thin white hair tied back, worn grey-brown robe, no legs, sitting in a plain wooden chair with cart wheels, a blanket flat over his lap) watches from his chair, chin resting on one hand, with the faintest smile. Bamboo grove and a starry sky behind.'
