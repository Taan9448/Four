id: ignis_stand
type: character-standing
character: ignis
summary: 화염군주 이그니스 반신 그림(기본·결의·놀람) — 거인 클로즈업으로 다시 그림(2026-10-22, 칸에 몸 전체를 구겨 넣지 않고, 머리·어깨만 크게 잘라 보여 준다)
bleed: true
framing: >-
  Ignis is a GIANT three times a man's height. Frame him as a CLOSE-UP of the head, shoulders and upper chest only: the crown of flames starts near the top
  edge (its tips may be cut by the top edge), the faceless head is LARGE, about 40% of the cell width, centered with the eye holes at about one fifth of the
  cell height; the broad shoulders and the tops of the arms spread wider than the cell and are cut off by both panel sides; the body is cut off by the bottom
  edge at the upper stomach. The low camera looks up at him so he looms over the viewer. Do NOT show the whole silhouette and do NOT squeeze the body to fit
  the narrow cell: it is a close-up of something far too big for the frame, and the parts that do not fit are simply cut off by the panel sides and the bottom
  edge.
frame_notes:
  1: "neutral expression — a huge faceless head of white flame filling the upper cell, two white-hot eye holes, thick black lava veins across the massive chest, the shoulders running off both sides"
  2: "resolute expression — the flames roaring higher, one huge burning fist rising into the frame from below, in front of the chest"
  3: "surprised expression — the white flame split from crown to chest, the lava veins going dark"
