summary: '「결」 이야기 그림 — 골방의 왕 노인(7장) · 장면 사이를 잇는 원작 장면(2026-11-13 매끄러운 이야기)'
frame_notes:
  1: 'A cramped back storeroom behind the kitchen of Ungok Inn, lit by a single oil lamp, sacks of grain and jars stacked. Wang Ilgeom (a very old man with a sickle-bent back, thin white hair tied back, worn grey-brown robe, no legs, sitting in a plain wooden chair with cart wheels, a blanket flat over his lap) sits in his wheeled chair; Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) kneels on the floor before him with head bowed, one hand on the old man''s blanket. The pot-bellied bald innkeeper Ma stands in the doorway holding the curtain aside, his face soft. Emotional reunion after three years.'
