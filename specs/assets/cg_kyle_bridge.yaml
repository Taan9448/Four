# 2026-10-12 D2: 그림 없던 절정 장면(s9_scene_kyle_stays)
frame_notes:
  1: >-
    Inside the world's rift, a void of drifting dark fragments and slow wind like the breath of a giant lung. A long narrow bridge of hardened shadow, black and light-swallowing, stretches across the void. At the near end of the bridge Kyle Rowen, the blond young knight in silver plate armor, stands alone with his back to the viewer turned three-quarters, his crimson-bladed long sword raised in guard, eyes closed and smiling, a small silver snowflake necklace at his throat. Before him hundreds of shadow wraiths with black wedge-carved daggers rise from the bridge like smoke. Far behind him, two small figures — a lean swordsman in grey and a silver-haired mage — run hand in hand into the darkness at the far end.
