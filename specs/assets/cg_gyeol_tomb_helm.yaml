frame_notes:
  1: 'A vast dark dwarven tomb-cavern full of heaps of dented black armor. A dwarf tomb warrior in crushed ancient armor is rising from the heap; Born (short, very broad dwarf warrior with a red beard in three braids) kneels on the rubble before it and gently lays his big hand on its dented helmet, eyes lowered with grief rather than anger. A lantern stands on the rocks. Behind Born, Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) waits with his sword lowered, giving him room.'
