frame_notes:
  1: >-
    keep exactly the same shapes and positions as the magic card frame (reference: assets/sprites/card_frame_magic/frame_01.png): the same
    art window, cost socket(s), name banner, rarity socket, text box and type plaque; only the materials and ornaments change.
    the WHOLE border is reforged in dark violet star-steel: deep violet-black metal plates (#2b2b3a, #4b3a6b, #6b4fa3) with bright violet lightning veins (#a35cff, #d4b8ff) crackling across them, a violet glow line around the art window, a small faceted violet crystal (#a35cff, #d4b8ff) at each corner; the outer edge is near-black (#0b0b10); a few touches of the magic frame remain: thin strips of deep blue leather (#1f3f73) between the metal plates and the ring of abstract magic-circle marks (dots and arcs, no letters) around the art window rim
style: >-
  crisp detailed pixel art in the style of a late 16-bit era game interface; 1-pixel dark outline on the outer edge, 2-3 flat tone
  steps per material, bevelled metal reads clearly, no anti-aliasing, no gradients, no dithering noise, no blur
