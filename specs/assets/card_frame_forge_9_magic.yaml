# 장식은 훨씬 화려하게, 재질은 +9(보랏빛 번개)로 바뀐다. 그림이 오면 게임이 card_frame_magic 대신 이 틀을 쓴다(src/ui/card-view.ts). 오기 전에는 겹치는 테두리(card_frame_forge_9)
