frame_notes:
  1: "a cloth polishing a steel sword blade"  # 검 손질
  2: "a dented knight breastplate standing upright, one small cut glinting"  # 기사의 긍지
  3: "a knight with shield and arm spread wide across a black crack"  # 막아서다
  4: "a horned dwarf helmet ramming forward"  # 뿔 들이받기
  5: "two warriors standing back to back, an axe and a sword raised"  # 등을 맞대고
