style: >-
  crisp pixel art in the style of late 16-bit era game item and skill illustrations; flat 2-3 tone shading, light from the upper left, a 1-pixel dark outline around the main subject only; cells 1-3 use a cool steel palette: moonlit silver, steel grey, deep blue and white with warm red accents; cells 4-6 use a warm stone and forge palette: granite grey, iron, ember orange, earth brown and red beard tones; no anti-aliasing, no gradients, no dithering noise, no blur
