id: cg_wudang_knot
type: story-cg
summary: 장면 일러스트 — 혈마삼재진 — 진무관 위 하늘의 매듭(S7, 3권 9장)
frame_notes:
  1: >-
    Mount Wudang: the Taoist temple Jinmu-gwan with its sweeping tiled roofs, sealed for three years and wrapped in a dark blood-red fog. The fog pours out of three great rocks around the temple, each guarded by a demonic-cult protector in dark crimson, and the three streams rise and twist together into a single tangled knot hanging in the air high above the temple roof, about twenty jang up. Grey mountain peaks and pines around, a cold grey sky.
