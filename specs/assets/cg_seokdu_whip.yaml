summary: 장면 일러스트 — 보름의 연무장 — 채찍을 잡은 손(S6, 3권 8장)
frame_notes:
  # 2026-10-17 다시 그리기 2차: 1차 재작화(#1368)는 옛 그림을 열 번 덧칠하다 손이 무너지고 '검으로 쳐내기'로 바뀌었다.
  # 원작대로 '맨손으로 잡기'로 되돌리고, 인물을 줄인 중간 거리 구도로 손 하나에 시선을 모은다. 손 방향을 못박는다.
  1: >-
    Medium shot at night under a full moon, in a sandy training yard lit by torches; the rows of white-robed guards with red sleeve tassels are only a soft, simple, out-of-focus band far in the background. LEFT THIRD: a huge, thin young man seen from behind from the waist up, his bare back covered with old red whip marks, heavy chains on his wrists; only his back, shoulders and the back of his head show. CENTER: Jin Haun, seen in side view facing RIGHT, standing just behind the chained man's right shoulder. Haun's LEFT arm (the arm nearest the viewer) is raised in front of his chest with the elbow bent and pointing down; his left fist is at the height of his chin, close to his face. His fist is CLOSED AROUND the whip: the back of his hand and his knuckles face the viewer, the thumb is wrapped over the top, and the whip cord runs out of his fist from the thumb side, straight and taut, up and to the right toward the platform; the short loose end with its small black iron hook hangs down from the little-finger side of his fist, and a thin line of blood runs from his palm down his wrist. His right arm is lowered and mostly hidden behind his body; the plain black scabbard hangs at his left hip with the sword inside it. His face is calm, eyes on the platform. RIGHT THIRD, a little higher: a low wooden platform a few steps away, on it a narrow-faced young man in a white robe with sharply upturned eyes, dark circles under them and a faint reddish haze around him, his right arm stretched forward and down, his fist holding the wooden whip handle; the single whip is ONE straight taut line from his fist to Haun's fist. Haun's sword stays sheathed: he holds NO drawn sword, NO axe, nothing in his hands except the whip.
framing: >-
  A cinematic story illustration for a visual-novel scene. The bottom quarter of the picture will be covered by a dialogue box, so keep faces, hands and the key action in the upper three quarters. Wide 3:2 frame, strong readable silhouettes, dramatic light, no text. Correct human anatomy for every figure: each person has exactly two arms of normal length and two hands with five fingers; no stretched or extra-long arms, no twisted wrists, no extra hands. Keep it simple: three people, one whip, one clear gesture.
