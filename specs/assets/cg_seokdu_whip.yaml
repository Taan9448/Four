summary: 장면 일러스트 — 보름의 연무장 — 채찍을 잡은 손(S6, 3권 8장)
frame_notes:
  # 2026-10-17 다시 그리기: 첫 그림은 채찍을 잡은 하운의 팔이 몸길이만큼 늘어나 보였다(사용자 지적). 거리를 좁히고 팔을 굽혀 몸 가까이에서 잡게 한다.
  1: >-
    Full-moon night in the Cheongun sect's training yard of deep river sand, torches burning, two hundred guards in white robes with red tassels on their sleeves standing in rows in the background. A low raised wooden platform stands only a few steps away on the right. On it a narrow-faced young man in a white robe, with sharply upturned eyes and dark circles under them and a faint reddish haze around him, has lashed down with an iron-hooked whip; the whip is short and pulled taut in a straight line from his fist down to the catching hand. In the left foreground a huge young man with door-wide shoulders gone thin, seen from behind, his bare back covered with layered whip marks, stands in chains and refuses to kneel. Jin Haun, in his grey servant outfit, has stepped in right behind the chained man's shoulder, between him and the platform, and caught the whip a hand's breadth from that back. Haun's catching arm is BENT at the elbow, his fist at about shoulder height close to his own body, his other hand on the hilt at his hip; both of Haun's arms have normal human length and proportions. The iron hooks bite into his calloused palm, blood running down his wrist. He carries the plain, narrow, completely unadorned 'ugly sword' with a crude plain grip, in a plain black scabbard at his hip; he does NOT carry an axe.
