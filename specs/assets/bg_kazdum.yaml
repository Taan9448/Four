summary: 전투 배경 — 카즈둠(S4, 2권 7~8장)
frame_notes:
  1: >-
    Inside the dead dwarf mountain Kazdum: on the left and right edges carved stone pillars with dwarf runes, a mine cart rail running into darkness. In the distance a vast cavern (the Heart of the Mountain) with heaps of empty black armor half buried under fallen rock, faint red lava-light seeping through cracks in the far wall. The ground is rough cut stone with scattered tools. Dark grey and brown with small dull red-orange glows.
