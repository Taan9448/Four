summary: '「결」 이야기 그림 — 낙엽이 닿지 않는 학창의(1장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'Dusk at the edge of a forest above a cliff. Over-the-shoulder shot from behind the boy: in the left foreground only the shoulder, long black hair and the axe handle of a servant boy in grey, and the crumbled rim of a cliff with pebbles falling away. Facing him, stepping out of the autumn forest at the border of the trees, Kwak Dojin, close enough to see his calm cold eyes: red and yellow leaves fall all around him but slide off in the air — not a single leaf touches his white crane-pattern robe. One hand rests lightly on the hilt of his still-sheathed sword. Low golden light through the trunks behind him.'
