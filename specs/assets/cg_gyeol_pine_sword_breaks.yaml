frame_notes:
  1: 'Night on a mountain peak. Mid-duel: the tip of Kwak Dojin''s pine-grain sword snaps off and spins away into the air, glittering. A young swordsman in grey does not resist — his body turns with the push like a log rolling in water, his narrow blade guiding the force aside. Kwak''s cold eyes widen for the first time. Wind tears at his white crane robe.'
