frame_notes:
  1: 'Night on a mountain peak. Mid-duel: the tip of Kwak Dojin''s pine-grain sword snaps off and spins away into the air, glittering. A young swordsman in grey does not resist — his body turns with the push like a log rolling in water, his narrow blade guiding the force aside. Kwak''s cold eyes widen for the first time. Wind tears at his white crane robe. Pose (redrawn 2026-11-16): the young swordsman is seen in side view, turning his whole body with the push; his sword arm stays in FRONT of his body, the narrow blade angled down and to the side, both feet planted and his shoulders turning together with the hips. Kwak''s own sword is straight up to the broken point; only the snapped tip flies away.'
