id: bg_volcano_canyon
type: background
summary: 전투 배경 — 화산 협곡(S1 보스, 불타는 협곡 마을)
frame_notes:
  1: >-
    A volcanic canyon at night. Dark basalt cliff walls rise on the left and right edges with thin glowing orange lava cracks; in the
    far distance a burning canyon village with small roofs and rising embers under a smoky red-brown sky. The ground is cracked dark
    rock with a few faint orange seams. Black, dark brown and dull red with small hot orange accents; keep the fire glow low and
    behind, not bright behind the center.
