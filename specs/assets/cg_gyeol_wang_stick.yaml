summary: '「결」 이야기 그림 — 운곡루 뒤뜰, 나무토막을 든 왕일검(서장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'Night in the back yard of Ungok Inn, a mountain-village inn: packed earth, a chopping block with an axe in it, a stack of firewood, a bamboo grove, one paper lantern under the eaves. Seen at a low angle from just behind and beside the old man''s wheeled chair: in the near foreground Wang Ilgeom (a very old man with a sickle-bent back, thin white hair tied back, worn grey-brown robe, no legs, sitting in a plain wooden chair with cart wheels, a blanket flat over his lap) holds up a short stick of firewood like a sword, its tip pointing across the yard. In the middle of the yard stands a wooden training dummy — a thick dark post with two stubby wooden arms and a rounded head. Beside the dummy Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) stands ready, sword in hand, looking at the stick tip rather than the dummy. Warm lantern light on the old man''s wrinkles, cool moonlight on the yard.'
