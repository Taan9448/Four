summary: '「결」 이야기 그림 — 아이를 안고 본 하늘의 금(8장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'After the battle on a mountain peak at dawn: Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) kneels on a broken stone floor carved with red channels, holding a small rescued child against his chest. Behind him, through a broken wall, a thin black crack runs straight up the pale dawn sky and does not close. Elia (silver-haired half-elf mage woman in a grey hooded travelling cloak, long wooden staff with a blue stone) runs toward them from the side.'
