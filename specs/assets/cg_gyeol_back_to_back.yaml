summary: '「결」 이야기 그림 — 등을 맞댄 두 사람(10장) · 「천외귀환」에 없는 새 장면(2026-11-12)'
frame_notes:
  1: 'On a small floating rock in the red-black rift: Elia (silver-haired half-elf mage woman in a grey hooded travelling cloak, long wooden staff with a blue stone) and Jin Haun (lean young man, long straight black hair with long bangs over calm black eyes, worn grey servant outfit, a narrow plain unadorned sword with a plain black scabbard) stand back to back. Elia, staff raised, watches the flows of silver and blue streaming around them; Haun, sword ready, looks up at a colossal faceless being looming above — where its eyes should be there are holes into which the light folds inward.'
