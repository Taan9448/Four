id: bg_arden
type: background
summary: 전투 배경 — 아르덴(S3, 2권 5~6장)
frame_notes:
  1: >-
    The frozen kingdom of Arden: on the left edge a farmhouse sealed in clear ice with smoke frozen above its chimney, on the right edge an ice-covered stone wall of the royal city. In the distance an ice palace that rose out of a frozen lake, with a tall roofless tower, under a pale grey-blue sky with slowly falling snow. The ground is a frozen field of barley stalks trapped under ice. Pale blue, white and grey with a little cold silver.
