summary: 장면 일러스트 — 은빛 숲의 잠든 문 — 넷이 함께 넘는 문(S5 끝)
frame_notes:
  1: >-
    Dawn in the silver forest of Silvaren before an ancient sleeping stone gate covered in faint wave-like carvings that are glowing blue, the gate now open onto a band of warm light, pine branches and wood smoke on the other side. Seen from behind, four figures walk into the light together: Jin Haun in his grey servant outfit with a narrow plain sword in a plain black scabbard at his hip, Elia in her grey hooded travelling cloak with her blue-stone staff, Kyle in silver plate armor, and Born, a short stocky red-bearded dwarf with a big two-handed axe on his shoulder. Behind them, on this side, a crowd sees them off under the silver trees: a frail elf woman with silver hair reaching the ground, a blonde princess in a sky-blue gown, armored knights, dwarves, a stout innkeeper woman holding a stew pot, a man and a small boy waving. Soft silver leaves drifting, bittersweet morning light. No readable writing on the gate. Haun carries the plain, narrow, completely unadorned 'ugly sword' with a crude plain grip, in a plain black scabbard; he does NOT carry an axe.
