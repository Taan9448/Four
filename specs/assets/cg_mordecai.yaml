frame_notes:
  1: >-
    The heart of the world's rift: a colossal shapeless being looms over a few floating rock fragments — the Hell King Mordecai. His spine is made of hundreds of black iron wedges bound together, points turned inward. One arm is a river of flowing silver mana, the other a coil of golden ring-shaped qi; legs, wings and horns of nameless worlds' energies branch from his body. In the center of his chest a tangled heart of blue and black light pulses. Tiny before him on a cracked fragment, Jin Haun in his grey outfit with the narrow plain sword stands with eyes closed and perfectly still, Elia the silver-haired half-elf mage beside him gripping his sleeve. Dark violet and black void, silver and gold light from the monster's arms.
