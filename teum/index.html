<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>틈 — 천외귀환 외전</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E9%9A%99&display=block" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;800&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" />
  </head>
  <body>
    <!-- 먹 번짐: 로고 글자 가장자리를 붓 자국처럼(결과 같다) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
