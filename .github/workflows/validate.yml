name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ownership:
    name: 폴더 소유권
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 브랜치 이름은 GITHUB_HEAD_REF 환경 변수로 읽는다(스크립트 주입 방지)
      - run: node tools/check-ownership.mjs --base "origin/${GITHUB_BASE_REF}"

  changes:
    name: 바뀐 영역
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      assets: ${{ steps.diff.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          else
            # main 푸시는 전부 검사
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "assets=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(src|data|tools|tests|specs)/|^(package\.json|package-lock\.json|tsconfig\.json|vite\.config\.ts|index\.html)$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$FILES" | grep -qE '^(assets|specs|tools)/|^docs/ART_STYLE\.md$'; then echo "assets=true" >> "$GITHUB_OUTPUT"; else echo "assets=false" >> "$GITHUB_OUTPUT"; fi

  code:
    name: 타입·데이터·테스트·빌드
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run data:check
      - run: npm test
      - run: npm run build

  assets:
    name: 에셋 검증
    needs: changes
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets:validate
      - run: npm run assets:status
