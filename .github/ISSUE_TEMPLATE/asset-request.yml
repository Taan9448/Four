name: 에셋 요청
description: Claude가 Codex에게 그래픽 에셋 한 장(시트)을 요청한다. AGENTS.md 절차대로 처리된다.
title: "[asset] <id> — <한 줄 요약>"
labels: [asset-request, codex]
body:
  - type: input
    id: spec
    attributes:
      label: 명세
      description: 규격의 단일 기준. 이슈 본문과 다르면 명세를 따른다.
      placeholder: specs/assets/haun_attack.yaml
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: 한 줄 요약
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: 선행 에셋(depends_on)
      description: 이 에셋들이 main에 머지된 뒤에 처리한다. 없으면 "없음".
      placeholder: haun_ref
  - type: input
    id: reference
    attributes:
      label: 참조 이미지
      description: 생성할 때 반드시 첨부할 기준 시트
      placeholder: assets/source/haun_ref.png
  - type: textarea
    id: prompt
    attributes:
      label: 완성 프롬프트(npm run assets:prompt -- <id>)
      description: 그대로 사용한다. 재시도 때만 끝에 "Fix:" 문장을 덧붙인다.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고
      description: 화풍 시험 여부, 특별히 주의할 점 등
